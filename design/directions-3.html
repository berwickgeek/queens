<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queens: Storybook map, grid options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito+Sans:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f3f4f6; color: #1d1f23; font: 16px/1.5 "Source Sans 3", system-ui, sans-serif; }
  main { max-width: 1320px; margin: 0 auto; padding: 32px 24px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .lede { color: #555b66; margin: 0 0 28px; max-width: 75ch; }
  .variant { display: grid; grid-template-columns: 390px 390px 1fr; gap: 28px; align-items: start; margin-bottom: 48px; }
  .variant h2 { font-size: 20px; margin: 0 0 6px; }
  .variant p { margin: 0 0 10px; color: #3c414b; font-size: 15px; }
  .screen { width: 390px; height: 700px; border-radius: 36px; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(20,30,50,.12);
            background: #fbfcfd; color: #2a3446; font-family: "Nunito Sans", sans-serif; }
  .top { padding: 46px 26px 0; text-align: center; }
  .lvl { font-family: "Young Serif", serif; font-size: 28px; line-height: 1.15; }
  .sub { font-size: 15px; color: #5a6578; margin-top: 4px; }
  .sub b { font-variant-numeric: tabular-nums; color: #2a3446; }
  .mapwrap { margin: 26px 18px 0; position: relative; }
  .mapwrap.coords { margin-left: 30px; margin-top: 40px; }
  .boardwrap { position: relative; }
  .board { display: grid; }
  .cell { position: relative; display: grid; place-items: center; aspect-ratio: 1; min-width: 0; box-sizing: border-box; }
  .wash { filter: url(#watercolour); }
  svg.overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  svg.wobble { filter: url(#wobble); }
  .x { color: rgba(42,52,70,.5); font-family: "Young Serif"; }
  .colhead, .rowhead { position: absolute; display: grid; font-family: "Young Serif"; color: #6a7487; font-size: 12px; }
  .colhead { left: 0; right: 0; top: -20px; }
  .rowhead { top: 0; bottom: 0; left: -18px; width: 14px; }
  .colhead span, .rowhead span { display: grid; place-items: center; }
  .rowhead span.on, .colhead span.on { color: #2a3446; font-weight: 700; }
  .bar { position: absolute; bottom: 34px; left: 24px; right: 24px; display: flex; gap: 12px; }
  .bar button { flex: 1; height: 52px; border: 1.5px solid #2a3446; border-radius: 26px; background: #fff; font: 700 15px "Nunito Sans"; color: #2a3446; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="watercolour"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>
  <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="2"/><feDisplacementMap in="SourceGraphic" scale="2.5"/></filter>
</svg>
<main>
  <h1>Storybook map: three ways to show the rows and columns</h1>
  <p class="lede">Each option on the left at 8x8 mid-game, and on the right at 11x11 (the hardest case for clarity). Kingdom borders stay as the wobbly ink line; what changes is how the cell grid shows through the watercolour.</p>
  <div id="variants"></div>
</main>
<script>
const P8 = { n: 8, regions: "aaaabbbbeeabbbbbeaaabcbbeedaacbbeeeacccbeeeafffbgggggfffggghhfff", q: [[0,3],[2,5],[4,0]], x: [[0,2],[0,4],[1,2],[1,3],[1,4],[3,4],[3,5],[3,6],[5,1],[1,6]], title: "The Marsh of Eight", focus: [2,5] };
const P11 = { n: 11, regions: "cccccccccaaccddbddccaaccdddddcccdgdddfddddddggfffddddefggffffddddfgggffffffffggfffffhfffigffjffhfffiiijjfhhfhfikijjjhhhhf", q: [[0,10],[1,4],[3,6]], x: [[0,9],[1,9],[1,10],[0,3],[0,5],[2,3],[2,4],[2,5],[2,6],[2,7],[4,5],[4,7],[3,5],[3,7]], title: "The Eleven Fens", focus: [3,6] };
const pal = ["#a8cbe0","#f2c58a","#b9d9a3","#e9a9a1","#cbb8de","#f1e28f","#9ed1c6","#e6b8cf","#c9c48a","#f4b98c","#b4c1e3"];
const crown = (size) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><path d="M3 18 L4.5 7.5 L9 12 L12 5 L15 12 L19.5 7.5 L21 18 Z" fill="#2a3446" stroke="#2a3446" stroke-width="1.2" stroke-linejoin="round"/><rect x="3" y="18.5" width="18" height="2.5" rx="1.2" fill="#2a3446"/></svg>`;
const has = (list,r,c) => list.some(q => q[0]===r && q[1]===c);

const VARIANTS = [
  { key: "pencil", name: "1. Pencil grid",
    text: "A fine graphite line runs between every cell, drawn over the watercolour but under the ink borders, like the pencil grid a cartographer sketches before inking. Three line weights do the work: hairline for cells, firm ink for kingdoms, heavier ink for the frame. The closest to E as you saw it.",
    grid: { stroke: "rgba(42,52,70,.28)", width: .35, dash: null }, gaps: false, coords: false, highlight: false },
  { key: "survey", name: "2. Survey sheet",
    text: "Each cell is its own small wash with a sliver of white paper between cells, so the grid shows as gaps rather than lines. Map coordinates (A to K across, 1 to 11 down) sit round the edge like a survey sheet. Rows and columns read the most clearly of the three, and the coordinates help you track 'column F' at 11x11. The washes look a little more like tiles.",
    grid: null, gaps: true, coords: true, highlight: false },
  { key: "crosshair", name: "3. Pencil grid with crosshair",
    text: "Option 1's pencil grid plus map coordinates, and the row and column of the cell you last touched get a soft lighter band, like a ruler laid across the map. The band fades after a moment. This is the most help for scanning a row at 11x11, and it's the most going on. The mockup shows the band on the last queen placed.",
    grid: { stroke: "rgba(42,52,70,.3)", width: .35, dash: "1.2 .9" }, gaps: false, coords: true, highlight: true },
];

function buildBoard(P, v, size) {
  const n = P.n, s = 100 / n;
  const wrap = document.createElement("div"); wrap.className = "mapwrap" + (v.coords ? " coords" : "");
  const bw = document.createElement("div"); bw.className = "boardwrap"; wrap.appendChild(bw);
  // Watercolour layer.
  const wash = document.createElement("div"); wash.className = "wash";
  const cells = document.createElement("div"); cells.className = "board";
  cells.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  if (v.gaps) { cells.style.gap = n > 9 ? "2px" : "3px"; }
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const d = document.createElement("div"); d.className = "cell";
    d.style.background = pal[P.regions.charCodeAt(r*n+c)-97];
    if (v.gaps) d.style.borderRadius = "2px";
    cells.appendChild(d);
  }
  wash.appendChild(cells); bw.appendChild(wash);
  // Crosshair band.
  let svg = "";
  if (v.highlight) {
    const [fr, fc] = P.focus;
    svg += `<rect x="0" y="${fr*s}" width="100" height="${s}" fill="rgba(255,255,255,.45)"/><rect x="${fc*s}" y="0" width="${s}" height="100" fill="rgba(255,255,255,.45)"/>`;
  }
  // Pencil grid.
  if (v.grid) {
    let d = "";
    for (let i = 1; i < n; i++) d += `M${i*s} 0 V100 M0 ${i*s} H100 `;
    svg += `<path d="${d}" fill="none" stroke="${v.grid.stroke}" stroke-width="${v.grid.width}" ${v.grid.dash ? `stroke-dasharray="${v.grid.dash}"` : ""}/>`;
  }
  bw.insertAdjacentHTML("beforeend", `<svg class="overlay" viewBox="0 0 100 100" preserveAspectRatio="none">${svg}</svg>`);
  // Ink kingdom borders.
  let d = "";
  const reg = (r,c) => P.regions[r*n+c];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (c < n-1 && reg(r,c) !== reg(r,c+1)) d += `M${(c+1)*s} ${r*s} V${(r+1)*s} `;
    if (r < n-1 && reg(r,c) !== reg(r+1,c)) d += `M${c*s} ${(r+1)*s} H${(c+1)*s} `;
  }
  const bwidth = v.gaps ? 1.0 : .85;
  bw.insertAdjacentHTML("beforeend", `<svg class="overlay wobble" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="#2a3446" stroke-width="${bwidth}" stroke-linecap="round"/><rect x="0" y="0" width="100" height="100" fill="none" stroke="#2a3446" stroke-width="1.3"/></svg>`);
  // Marks.
  const marks = document.createElement("div"); marks.className = "board";
  marks.style.cssText = `position:absolute;inset:0;grid-template-columns:repeat(${n},1fr);${v.gaps ? `gap:${n > 9 ? 2 : 3}px` : ""}`;
  const cs = size === "s" ? 20 : 26, xs = size === "s" ? 12 : 15;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const m = document.createElement("div"); m.className = "cell";
    if (has(P.q,r,c)) m.innerHTML = crown(cs);
    else if (has(P.x,r,c)) m.innerHTML = `<span class="x" style="font-size:${xs}px">×</span>`;
    marks.appendChild(m);
  }
  bw.appendChild(marks);
  // Coordinates.
  if (v.coords) {
    const L = "ABCDEFGHIJK";
    const on = (i, axis) => v.highlight && P.focus[axis] === i ? ' class="on"' : "";
    bw.insertAdjacentHTML("beforeend", `<div class="colhead" style="grid-template-columns:repeat(${n},1fr)">${[...L.slice(0,n)].map((l,i)=>`<span${on(i,1)}>${l}</span>`).join("")}</div><div class="rowhead" style="grid-template-rows:repeat(${n},1fr)">${Array.from({length:n},(_,i)=>`<span${on(i,0)}>${i+1}</span>`).join("")}</div>`);
  }
  return wrap;
}

function screen(P, v, size) {
  const el = document.createElement("div"); el.className = "screen";
  el.innerHTML = `<div class="top"><div class="lvl">${P.title}</div><div class="sub">3 of ${P.n} queens crowned, <b>${P.n === 8 ? "1:42" : "4:07"}</b></div></div><div class="slot"></div><div class="bar"><button>Undo</button><button>Clear</button><button>Hint</button></div>`;
  el.querySelector(".slot").appendChild(buildBoard(P, v, size));
  return el;
}

const host = document.getElementById("variants");
for (const v of VARIANTS) {
  const row = document.createElement("section"); row.className = "variant";
  row.appendChild(screen(P8, v));
  row.appendChild(screen(P11, v, "s"));
  const t = document.createElement("div"); t.innerHTML = `<h2>${v.name}</h2><p>${v.text}</p>`;
  row.appendChild(t);
  host.appendChild(row);
}
</script>
</body>
</html>
